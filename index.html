<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY CAFE GUIDE｜台中咖啡廳</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f6f3;
  color:#333;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang TC","Noto Sans TC",Arial,sans-serif;
}

header{
  background:#fff;
  padding:28px 20px 22px;
  text-align:center;
  border-bottom:1px solid #eee;
}

header h1{
  margin:0;
  font-size:20px;
  letter-spacing:2px;
  font-weight:600;
}

header .sub{
  margin-top:7px;
  font-size:15px;
  letter-spacing:2px;
}

header .small{
  margin-top:8px;
  font-size:12px;
  color:#999;
}

.top-area{
  padding:15px;
  max-width:900px;
  margin:auto;
}

.search-box{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.search-box input{
  flex:1;
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px 14px;
  font-size:14px;
  outline:none;
  background:#fff;
}

.add-btn{
  border:0;
  background:#333;
  color:#fff;
  border-radius:10px;
  padding:0 16px;
  font-size:14px;
}

.categories{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:5px;
}

.categories button{
  flex:none;
  border:1px solid #ddd;
  background:#fff;
  color:#666;
  border-radius:20px;
  padding:8px 13px;
  font-size:13px;
}

.categories button.active{
  background:#333;
  color:#fff;
  border-color:#333;
}

#cafeList{
  max-width:900px;
  margin:0 auto;
  padding:0 15px 40px;
}

.cafe-card{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
}

.photo-area{
  background:#eee;
  position:relative;
  overflow:hidden;
}

/* ★ 固定 1:1，但大小可以調整 */
.photo-wrap{
  width:min(var(--photo-size),100%);
  aspect-ratio:1 / 1;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  background:#eee;
}

.photo-wrap img{
  position:absolute;
  width:100%;
  height:100%;
  max-width:none;
  object-fit:cover;

  /*
    下面三個值會由每張照片自己的設定控制
  */
  transform:
    translate(
      var(--photo-x, 0%),
      var(--photo-y, 0%)
    )
    scale(var(--photo-scale, 1));

  transform-origin:center center;
}

.photo-placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:13px;
}

.photo-count{
  position:absolute;
  right:10px;
  bottom:10px;
  background:rgba(0,0,0,.55);
  color:#fff;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
}

.card-content{
  padding:16px;
}

.card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.card-title{
  font-size:18px;
  font-weight:600;
  margin:0;
}

.favorite{
  border:0;
  background:none;
  font-size:23px;
  padding:0;
  line-height:1;
}

.meta{
  margin-top:8px;
  color:#888;
  font-size:13px;
  line-height:1.7;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px;
}

.tag{
  background:#f2f1ee;
  color:#666;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
}

.description-box{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #eee;
}

.description-title{
  font-size:12px;
  color:#999;
  margin-bottom:5px;
}

.description{
  font-size:14px;
  color:#555;
  line-height:1.75;
  white-space:pre-wrap;
  word-break:break-word;
}

.card-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.card-actions button{
  flex:1;
  border:1px solid #ddd;
  background:#fff;
  border-radius:9px;
  padding:9px 5px;
  font-size:12px;
  color:#555;
}

.card-actions button.map{
  background:#333;
  color:#fff;
  border-color:#333;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:60px 20px;
  font-size:14px;
}

/* Modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:999;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:#fff;
  width:100%;
  max-width:620px;
  max-height:90vh;
  overflow-y:auto;
  border-radius:16px;
  padding:20px;
}

.modal-title{
  font-size:18px;
  font-weight:600;
  margin-bottom:18px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  font-size:13px;
  color:#555;
  margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid #ddd;
  border-radius:9px;
  padding:11px 12px;
  font-size:14px;
  outline:none;
  background:#fff;
}

.form-group textarea{
  min-height:110px;
  resize:vertical;
  line-height:1.7;
}

/* ★ 照片大小 */
.image-size-box{
  background:#f7f6f3;
  padding:12px;
  border-radius:10px;
}

.image-size-box input{
  margin-top:5px;
}

.helper{
  font-size:11px;
  color:#999;
  margin-top:6px;
  line-height:1.6;
}

/* ★ 照片調整區 */
.photo-edit-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.photo-editor{
  border:1px solid #eee;
  border-radius:12px;
  padding:12px;
  background:#fafafa;
}

.photo-editor-title{
  font-size:12px;
  color:#777;
  margin-bottom:10px;
}

.adjust-preview{
  width:180px;
  height:180px;
  margin:0 auto 12px;
  position:relative;
  overflow:hidden;
  background:#eee;
  border-radius:8px;
}

.adjust-preview img{
  position:absolute;
  width:100%;
  height:100%;
  max-width:none;
  object-fit:cover;
  transform:
    translate(
      var(--preview-x, 0%),
      var(--preview-y, 0%)
    )
    scale(var(--preview-scale, 1));
  transform-origin:center center;
}

.adjust-controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.control-item{
  background:#fff;
  border-radius:9px;
  padding:9px;
}

.control-item.full{
  grid-column:1 / -1;
}

.control-item label{
  font-size:11px;
  color:#777;
  display:block;
  margin-bottom:5px;
}

.control-item input[type="range"]{
  width:100%;
}

.range-value{
  text-align:center;
  font-size:11px;
  color:#999;
  margin-top:3px;
}

.remove-photo{
  width:100%;
  margin-top:10px;
  border:1px solid #ddd;
  background:#fff;
  color:#888;
  border-radius:8px;
  padding:8px;
  font-size:12px;
}

.preview-list{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.preview-item{
  position:relative;
  width:90px;
  height:90px;
  border-radius:8px;
  overflow:hidden;
  background:#eee;
}

.preview-item img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.preview-item button{
  position:absolute;
  right:4px;
  top:4px;
  width:22px;
  height:22px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  color:#fff;
  font-size:12px;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.modal-actions button{
  flex:1;
  border:1px solid #ddd;
  background:#fff;
  padding:11px;
  border-radius:9px;
  font-size:14px;
}

.modal-actions .save{
  background:#333;
  color:#fff;
  border-color:#333;
}

.delete-btn{
  color:#b44 !important;
}

@media(max-width:600px){
  .adjust-preview{
    width:160px;
    height:160px;
  }
}
</style>
</head>

<body>

<header>
  <h1>MY CAFE GUIDE</h1>
  <div class="sub">台中咖啡廳</div>
  <div class="small">慢慢喝一杯，找到喜歡的地方 ♡</div>
</header>

<div class="top-area">
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="搜尋咖啡廳、地址、特色...">
    <button class="add-btn" onclick="openModal()">＋ 新增</button>
  </div>

  <div class="categories" id="categories"></div>
</div>

<div id="cafeList"></div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-box">

    <div class="modal-title" id="modalTitle">新增咖啡廳</div>

    <div class="form-group">
      <label>店名</label>
      <input id="name" type="text" placeholder="例如：某某咖啡">
    </div>

    <div class="form-group">
      <label>區域</label>
      <select id="area"></select>
    </div>

    <div class="form-group">
      <label>地址</label>
      <input id="address" type="text" placeholder="輸入地址">
    </div>

    <div class="form-group">
      <label>Instagram</label>
      <input id="instagram" type="text" placeholder="Instagram 網址">
    </div>

    <div class="form-group">
      <label>特色／標籤</label>
      <input id="tags" type="text" placeholder="例如：不限時, 有插座, 寵物友善">
    </div>

    <div class="form-group">
      <label>照片</label>
      <input id="photos" type="file" accept="image/*,.heic,.heif" multiple>
      <div class="helper">
        可以一次選很多張照片，系統會自動壓縮。
      </div>
      <div class="preview-list" id="previewList"></div>
    </div>

    <div class="form-group">
      <label>照片大小（1:1）</label>

      <div class="image-size-box">
        <input
          id="imageHeight"
          type="number"
          min="100"
          max="600"
          value="260"
        >

        <div class="helper">
          照片會固定顯示為 1:1 正方形。<br>
          例如輸入 300，就是 300 × 300。<br>
          照片大小只控制正方形顯示尺寸，不會改變照片比例。
        </div>
      </div>
    </div>

    <!-- ★ 每張照片的位置與縮放 -->
    <div class="form-group">
      <label>調整照片位置</label>

      <div class="helper" style="margin-bottom:10px;">
        每張照片可以個別調整。<br>
        如果食物在下面，就把「上下位置」往上調；也可以調整縮放。
      </div>

      <div class="photo-edit-list" id="photoEditList"></div>
    </div>

    <!-- 備注 -->
    <div class="form-group">
      <label>備注</label>
      <textarea id="description" placeholder="輸入咖啡廳備注..."></textarea>
    </div>

    <div class="modal-actions">
      <button onclick="closeModal()">取消</button>
      <button class="delete-btn" id="deleteBtn" onclick="deleteCafe()" style="display:none;">刪除</button>
      <button class="save" onclick="saveCafe()">儲存</button>
    </div>

  </div>
</div>

<script>
const areas = [
  "全部",
  "中區",
  "東區",
  "西區",
  "南區",
  "北區",
  "西屯區",
  "南屯區",
  "北屯區",
  "豐原區",
  "大里區",
  "太平區",
  "清水區",
  "沙鹿區",
  "大甲區",
  "后里區",
  "潭子區",
  "龍井區",
  "新社區"
];

let cafes = JSON.parse(localStorage.getItem("myCafeGuide") || "[]");

let currentArea = "全部";
let editingId = null;
let currentPhotos = [];
let db = null;

/* =========================
   IndexedDB
========================= */

function initDB(){
  return new Promise((resolve,reject)=>{
    const request = indexedDB.open("MyCafeGuideImages",1);

    request.onupgradeneeded = function(e){
      const database = e.target.result;

      if(!database.objectStoreNames.contains("photos")){
        database.createObjectStore("photos",{
          keyPath:"id"
        });
      }
    };

    request.onsuccess = function(e){
      db = e.target.result;
      resolve(db);
    };

    request.onerror = function(){
      reject(request.error);
    };
  });
}

function saveImageBlob(id,blob){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction("photos","readwrite");
    const store = tx.objectStore("photos");

    store.put({
      id:id,
      blob:blob
    });

    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}

function getImageBlob(id){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction("photos","readonly");
    const store = tx.objectStore("photos");
    const request = store.get(id);

    request.onsuccess = ()=>{
      resolve(request.result ? request.result.blob : null);
    };

    request.onerror = ()=>{
      reject(request.error);
    };
  });
}

function deleteImageBlob(id){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction("photos","readwrite");
    tx.objectStore("photos").delete(id);

    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}

/* =========================
   HEIC
========================= */

function isHEIC(file){
  const name = file.name.toLowerCase();

  return (
    file.type === "image/heic" ||
    file.type === "image/heif" ||
    name.endsWith(".heic") ||
    name.endsWith(".heif")
  );
}

async function convertHEIC(file){
  if(!isHEIC(file)){
    return file;
  }

  if(typeof heic2any === "undefined"){
    throw new Error("HEIC轉檔套件尚未載入");
  }

  const converted = await heic2any({
    blob:file,
    toType:"image/jpeg",
    quality:.85
  });

  return Array.isArray(converted)
    ? converted[0]
    : converted;
}

/* =========================
   壓縮照片
========================= */

async function compressImage(file){
  const converted = await convertHEIC(file);

  return new Promise((resolve,reject)=>{

    const img = new Image();
    const url = URL.createObjectURL(converted);

    img.onload = function(){

      URL.revokeObjectURL(url);

      let width = img.width;
      let height = img.height;

      const maxSize = 1400;

      if(width > maxSize || height > maxSize){

        if(width > height){
          height = Math.round(height * maxSize / width);
          width = maxSize;
        }else{
          width = Math.round(width * maxSize / height);
          height = maxSize;
        }
      }

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext("2d");

      ctx.drawImage(img,0,0,width,height);

      let quality = .82;

      function tryCompress(){

        canvas.toBlob(function(blob){

          if(!blob){
            reject(new Error("照片壓縮失敗"));
            return;
          }

          if(blob.size > 180 * 1024 && quality > .45){

            quality -= .08;
            tryCompress();

          }else{
            resolve(blob);
          }

        },"image/jpeg",quality);
      }

      tryCompress();
    };

    img.onerror = function(){
      URL.revokeObjectURL(url);
      reject(new Error("無法讀取圖片"));
    };

    img.src = url;
  });
}

/* =========================
   Photo input
========================= */

document.getElementById("photos").addEventListener("change", async function(e){

  const files = Array.from(e.target.files);

  if(!files.length) return;

  for(const file of files){

    try{

      const blob = await compressImage(file);

      currentPhotos.push({
        id:null,
        blob:blob,

        /* ★ 每張照片自己的位置設定 */
        scale:1,
        x:0,
        y:0
      });

    }catch(error){

      console.error(error);
      alert("有照片無法讀取，請確認照片格式。");
    }
  }

  this.value = "";

  showPreview();
  renderPhotoEditors();
});

/* =========================
   Preview
========================= */

function showPreview(){

  const list = document.getElementById("previewList");

  list.innerHTML = "";

  currentPhotos.forEach((photo,index)=>{

    const item = document.createElement("div");
    item.className = "preview-item";

    const img = document.createElement("img");

    if(photo.blob){
      img.src = URL.createObjectURL(photo.blob);
    }else if(photo.url){
      img.src = photo.url;
    }

    item.appendChild(img);

    const button = document.createElement("button");

    button.innerHTML = "×";

    button.onclick = function(){
      removePhoto(index);
    };

    item.appendChild(button);

    list.appendChild(item);
  });
}

async function removePhoto(index){

  const photo = currentPhotos[index];

  if(photo && photo.id){
    try{
      await deleteImageBlob(photo.id);
    }catch(e){
      console.error(e);
    }
  }

  currentPhotos.splice(index,1);

  showPreview();
  renderPhotoEditors();
}

/* =========================
   Photo editor
========================= */

function renderPhotoEditors(){

  const list = document.getElementById("photoEditList");

  list.innerHTML = "";

  currentPhotos.forEach((photo,index)=>{

    const box = document.createElement("div");
    box.className = "photo-editor";

    const title = document.createElement("div");
    title.className = "photo-editor-title";
    title.textContent = `第 ${index + 1} 張照片`;

    box.appendChild(title);

    const preview = document.createElement("div");
    preview.className = "adjust-preview";

    const img = document.createElement("img");

    if(photo.blob){
      img.src = URL.createObjectURL(photo.blob);
    }else if(photo.url){
      img.src = photo.url;
    }

    preview.appendChild(img);

    box.appendChild(preview);

    const controls = document.createElement("div");
    controls.className = "adjust-controls";

    /* 縮放 */
    const scaleControl = document.createElement("div");
    scaleControl.className = "control-item full";

    const scaleLabel = document.createElement("label");
    scaleLabel.textContent = "照片縮放";

    const scaleInput = document.createElement("input");
    scaleInput.type = "range";
    scaleInput.min = "1";
    scaleInput.max = "2";
    scaleInput.step = "0.01";
    scaleInput.value = photo.scale || 1;

    const scaleValue = document.createElement("div");
    scaleValue.className = "range-value";
    scaleValue.textContent =
      Math.round((photo.scale || 1) * 100) + "%";

    scaleInput.oninput = function(){

      photo.scale = Number(this.value);

      scaleValue.textContent =
        Math.round(photo.scale * 100) + "%";

      updatePhotoPreview(preview,img,photo);
    };

    scaleControl.appendChild(scaleLabel);
    scaleControl.appendChild(scaleInput);
    scaleControl.appendChild(scaleValue);

    controls.appendChild(scaleControl);

    /* 左右 */
    const xControl = document.createElement("div");
    xControl.className = "control-item";

    const xLabel = document.createElement("label");
    xLabel.textContent = "左右位置";

    const xInput = document.createElement("input");
    xInput.type = "range";
    xInput.min = "-50";
    xInput.max = "50";
    xInput.step = "1";
    xInput.value = photo.x || 0;

    const xValue = document.createElement("div");
    xValue.className = "range-value";
    xValue.textContent = `${photo.x || 0}%`;

    xInput.oninput = function(){

      photo.x = Number(this.value);

      xValue.textContent = `${photo.x}%`;

      updatePhotoPreview(preview,img,photo);
    };

    xControl.appendChild(xLabel);
    xControl.appendChild(xInput);
    xControl.appendChild(xValue);

    controls.appendChild(xControl);

    /* 上下 */
    const yControl = document.createElement("div");
    yControl.className = "control-item";

    const yLabel = document.createElement("label");
    yLabel.textContent = "上下位置";

    const yInput = document.createElement("input");
    yInput.type = "range";
    yInput.min = "-50";
    yInput.max = "50";
    yInput.step = "1";
    yInput.value = photo.y || 0;

    const yValue = document.createElement("div");
    yValue.className = "range-value";
    yValue.textContent = `${photo.y || 0}%`;

    yInput.oninput = function(){

      photo.y = Number(this.value);

      yValue.textContent = `${photo.y}%`;

      updatePhotoPreview(preview,img,photo);
    };

    yControl.appendChild(yLabel);
    yControl.appendChild(yInput);
    yControl.appendChild(yValue);

    controls.appendChild(yControl);

    box.appendChild(controls);

    list.appendChild(box);

    updatePhotoPreview(preview,img,photo);
  });
}

function updatePhotoPreview(preview,img,photo){

  preview.style.setProperty(
    "--preview-scale",
    photo.scale || 1
  );

  preview.style.setProperty(
    "--preview-x",
    `${photo.x || 0}%`
  );

  preview.style.setProperty(
    "--preview-y",
    `${photo.y || 0}%`
  );
}

/* =========================
   Categories
========================= */

function renderCategories(){

  const box = document.getElementById("categories");

  box.innerHTML = "";

  areas.forEach(area=>{

    const button = document.createElement("button");

    button.textContent = area;

    if(area === currentArea){
      button.classList.add("active");
    }

    button.onclick = function(){

      currentArea = area;

      renderCategories();
      renderCafes();
    };

    box.appendChild(button);
  });

  const select = document.getElementById("area");

  select.innerHTML = "";

  areas
    .filter(a=>a !== "全部")
    .forEach(area=>{

      const option = document.createElement("option");

      option.value = area;
      option.textContent = area;

      select.appendChild(option);
    });
}

/* =========================
   Photo helpers
========================= */

async function getFirstPhoto(cafe){

  if(!cafe.photos || !cafe.photos.length){
    return null;
  }

  const first = cafe.photos[0];

  if(first.data){
    return first.data;
  }

  if(first.url){
    return first.url;
  }

  if(first.id && db){

    const blob = await getImageBlob(first.id);

    if(blob){
      return URL.createObjectURL(blob);
    }
  }

  return null;
}

function getPhotoCount(cafe){

  return cafe.photos
    ? cafe.photos.length
    : 0;
}

/* =========================
   Render cafes
========================= */

async function renderCafes(){

  const list = document.getElementById("cafeList");

  const keyword =
    document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  let filtered = cafes.filter(cafe=>{

    const areaOK =
      currentArea === "全部" ||
      cafe.area === currentArea;

    const text = [
      cafe.name,
      cafe.area,
      cafe.address,
      cafe.tags,
      cafe.description
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

    const searchOK =
      !keyword ||
      text.includes(keyword);

    return areaOK && searchOK;
  });

  if(!filtered.length){

    list.innerHTML =
      `<div class="empty">目前沒有符合的咖啡廳 ♡</div>`;

    return;
  }

  list.innerHTML = "";

  for(const cafe of filtered){

    const card = document.createElement("div");
    card.className = "cafe-card";

    const photoArea = document.createElement("div");
    photoArea.className = "photo-area";

    const size = Math.max(
      100,
      Math.min(
        600,
        Number(cafe.imageHeight) || 260
      )
    );

    const photoWrap = document.createElement("div");
    photoWrap.className = "photo-wrap";

    /* ★ 這裡真正控制正方形大小 */
    photoWrap.style.setProperty(
      "--photo-size",
      `${size}px`
    );

    const photo = cafe.photos && cafe.photos[0];

    if(photo){

      const img = document.createElement("img");

      let imageURL = null;

      if(photo.data){
        imageURL = photo.data;
      }else if(photo.url){
        imageURL = photo.url;
      }

      if(imageURL){

        img.src = imageURL;

      }else if(photo.id && db){

        const blob = await getImageBlob(photo.id);

        if(blob){
          img.src = URL.createObjectURL(blob);
        }
      }

      /* ★ 套用這一張照片自己的裁切位置 */
      img.style.setProperty(
        "--photo-scale",
        photo.scale || 1
      );

      img.style.setProperty(
        "--photo-x",
        `${photo.x || 0}%`
      );

      img.style.setProperty(
        "--photo-y",
        `${photo.y || 0}%`
      );

      photoWrap.appendChild(img);

    }else{

      const placeholder =
        document.createElement("div");

      placeholder.className =
        "photo-placeholder";

      placeholder.textContent =
        "尚未上傳照片";

      photoWrap.appendChild(placeholder);
    }

    photoArea.appendChild(photoWrap);

    if(getPhotoCount(cafe) > 1){

      const count = document.createElement("div");

      count.className = "photo-count";

      count.textContent =
        `${getPhotoCount(cafe)} 張照片`;

      photoArea.appendChild(count);
    }

    card.appendChild(photoArea);

    const content =
      document.createElement("div");

    content.className = "card-content";

    const top =
      document.createElement("div");

    top.className = "card-top";

    const title =
      document.createElement("h2");

    title.className = "card-title";

    title.textContent = cafe.name || "";

    top.appendChild(title);

    const favorite =
      document.createElement("button");

    favorite.className = "favorite";

    favorite.innerHTML =
      cafe.favorite ? "♥" : "♡";

    favorite.onclick = function(){
      toggleFavorite(cafe.id);
    };

    top.appendChild(favorite);

    content.appendChild(top);

    const meta =
      document.createElement("div");

    meta.className = "meta";

    meta.textContent =
      `${cafe.area || ""}${cafe.address ? " ・ " + cafe.address : ""}`;

    content.appendChild(meta);

    if(cafe.tags){

      const tags =
        document.createElement("div");

      tags.className = "tags";

      cafe.tags
        .split(",")
        .map(t=>t.trim())
        .filter(Boolean)
        .forEach(tagText=>{

          const tag =
            document.createElement("span");

          tag.className = "tag";

          tag.textContent = tagText;

          tags.appendChild(tag);
        });

      content.appendChild(tags);
    }

    if(cafe.description){

      const descriptionBox =
        document.createElement("div");

      descriptionBox.className =
        "description-box";

      const descriptionTitle =
        document.createElement("div");

      descriptionTitle.className =
        "description-title";

      descriptionTitle.textContent =
        "備注";

      const description =
        document.createElement("div");

      description.className =
        "description";

      description.textContent =
        cafe.description;

      descriptionBox.appendChild(
        descriptionTitle
      );

      descriptionBox.appendChild(
        description
      );

      content.appendChild(
        descriptionBox
      );
    }

    const actions =
      document.createElement("div");

    actions.className =
      "card-actions";

    const mapButton =
      document.createElement("button");

    mapButton.className = "map";

    mapButton.textContent =
      "📍 地圖";

    mapButton.onclick = function(){
      openMap(cafe.address);
    };

    actions.appendChild(mapButton);

    if(cafe.instagram){

      const igButton =
        document.createElement("button");

      igButton.textContent =
        "Instagram";

      igButton.onclick = function(){

        window.open(
          cafe.instagram,
          "_blank"
        );
      };

      actions.appendChild(igButton);
    }

    const editButton =
      document.createElement("button");

    editButton.textContent =
      "編輯";

    editButton.onclick = function(){
      editCafe(cafe.id);
    };

    actions.appendChild(editButton);

    content.appendChild(actions);

    card.appendChild(content);

    list.appendChild(card);
  }
}

/* =========================
   Open modal
========================= */

async function openModal(id=null){

  editingId = id;

  document.getElementById("modal")
    .classList.add("show");

  document.getElementById("modalTitle")
    .textContent =
      id ? "編輯咖啡廳" : "新增咖啡廳";

  document.getElementById("deleteBtn")
    .style.display =
      id ? "block" : "none";

  currentPhotos = [];

  if(id){

    const cafe =
      cafes.find(c=>c.id === id);

    if(!cafe) return;

    document.getElementById("name").value =
      cafe.name || "";

    document.getElementById("area").value =
      cafe.area || areas[1];

    document.getElementById("address").value =
      cafe.address || "";

    document.getElementById("instagram").value =
      cafe.instagram || "";

    document.getElementById("tags").value =
      cafe.tags || "";

    document.getElementById("description").value =
      cafe.description || "";

    document.getElementById("imageHeight").value =
      cafe.imageHeight || 260;

    if(cafe.photos){

      for(const photo of cafe.photos){

        if(photo.id && db){

          try{

            const blob =
              await getImageBlob(photo.id);

            if(blob){

              currentPhotos.push({
                id:photo.id,
                blob:blob,
                scale:photo.scale || 1,
                x:photo.x || 0,
                y:photo.y || 0
              });

            }
          }catch(e){
            console.error(e);
          }

        }else{

          currentPhotos.push({
            id:null,
            data:photo.data || null,
            url:photo.url || null,
            scale:photo.scale || 1,
            x:photo.x || 0,
            y:photo.y || 0
          });
        }
      }
    }

  }else{

    document.getElementById("name").value = "";

    document.getElementById("area").value =
      areas[1];

    document.getElementById("address").value = "";

    document.getElementById("instagram").value = "";

    document.getElementById("tags").value = "";

    document.getElementById("description").value = "";

    document.getElementById("imageHeight").value = 260;
  }

  showPreview();
  renderPhotoEditors();
}

function closeModal(){

  document.getElementById("modal")
    .classList.remove("show");

  editingId = null;
  currentPhotos = [];
}

/* =========================
   Save photos
========================= */

async function saveCurrentPhotos(cafeId){

  const photoRefs = [];

  for(let i=0;i<currentPhotos.length;i++){

    const photo =
      currentPhotos[i];

    /* 已存在的照片 */
    if(photo.id && photo.blob){

      await saveImageBlob(
        photo.id,
        photo.blob
      );

      photoRefs.push({
        id:photo.id,
        scale:photo.scale || 1,
        x:photo.x || 0,
        y:photo.y || 0
      });

      continue;
    }

    /* 新照片 */
    if(photo.blob){

      const imageId =
        cafeId +
        "_" +
        Date.now() +
        "_" +
        i +
        "_" +
        Math.random()
          .toString(36)
          .substring(2,8);

      await saveImageBlob(
        imageId,
        photo.blob
      );

      photoRefs.push({
        id:imageId,
        scale:photo.scale || 1,
        x:photo.x || 0,
        y:photo.y || 0
      });

      continue;
    }

    /* 舊版 Base64 照片 */
    if(photo.data){

      try{

        const response =
          await fetch(photo.data);

        const blob =
          await response.blob();

        const imageId =
          cafeId +
          "_" +
          Date.now() +
          "_" +
          i;

        await saveImageBlob(
          imageId,
          blob
        );

        photoRefs.push({
          id:imageId,
          scale:photo.scale || 1,
          x:photo.x || 0,
          y:photo.y || 0
        });

      }catch(e){

        console.error(e);
      }
    }
  }

  return photoRefs;
}

/* =========================
   Save cafe
========================= */

async function saveCafe(){

  const name =
    document.getElementById("name")
      .value.trim();

  if(!name){

    alert("請輸入店名");
    return;
  }

  const area =
    document.getElementById("area")
      .value;

  const address =
    document.getElementById("address")
      .value.trim();

  const instagram =
    document.getElementById("instagram")
      .value.trim();

  const tags =
    document.getElementById("tags")
      .value.trim();

  const description =
    document.getElementById("description")
      .value;

  const imageHeight =
    Math.max(
      100,
      Math.min(
        600,
        Number(
          document.getElementById("imageHeight").value
        ) || 260
      )
    );

  const cafeId =
    editingId ||
    (
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2,8)
    );

  let oldCafe =
    cafes.find(c=>c.id === cafeId);

  const photoRefs =
    await saveCurrentPhotos(cafeId);

  const cafe = {

    id:cafeId,

    name:name,

    area:area,

    address:address,

    instagram:instagram,

    tags:tags,

    description:description,

    imageHeight:imageHeight,

    photos:photoRefs,

    favorite:
      oldCafe
        ? !!oldCafe.favorite
        : false
  };

  if(editingId){

    const index =
      cafes.findIndex(
        c=>c.id === editingId
      );

    if(index !== -1){
      cafes[index] = cafe;
    }

  }else{

    cafes.unshift(cafe);
  }

  localStorage.setItem(
    "myCafeGuide",
    JSON.stringify(cafes)
  );

  closeModal();

  renderCafes();
}

/* =========================
   Edit
========================= */

function editCafe(id){

  openModal(id);
}

/* =========================
   Delete
========================= */

async function deleteCafe(){

  if(!editingId) return;

  const cafe =
    cafes.find(c=>c.id === editingId);

  if(!cafe) return;

  const ok =
    confirm(
      `確定要刪除「${cafe.name}」嗎？`
    );

  if(!ok) return;

  if(cafe.photos){

    for(const photo of cafe.photos){

      if(photo.id){

        try{
          await deleteImageBlob(photo.id);
        }catch(e){
          console.error(e);
        }
      }
    }
  }

  cafes =
    cafes.filter(
      c=>c.id !== editingId
    );

  localStorage.setItem(
    "myCafeGuide",
    JSON.stringify(cafes)
  );

  closeModal();

  renderCafes();
}

/* =========================
   Favorite
========================= */

function toggleFavorite(id){

  const cafe =
    cafes.find(c=>c.id === id);

  if(!cafe) return;

  cafe.favorite =
    !cafe.favorite;

  localStorage.setItem(
    "myCafeGuide",
    JSON.stringify(cafes)
  );

  renderCafes();
}

/* =========================
   Google Maps
========================= */

function openMap(address){

  if(!address){
    alert("這家店還沒有地址");
    return;
  }

  const url =
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(address);

  window.open(url,"_blank");
}

/* =========================
   Search
========================= */

document.getElementById("searchInput")
  .addEventListener("input",function(){

    renderCafes();
  });

/* =========================
   Escape HTML
========================= */

function escapeHTML(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttribute(text){

  return escapeHTML(text);
}

/* =========================
   Modal background
========================= */

document.getElementById("modal")
  .addEventListener("click",function(e){

    if(e.target === this){
      closeModal();
    }
  });
