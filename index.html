<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY CAFE GUIDE｜台中咖啡廳</title>
<style>
*{
  box-sizing:border-box;
}
body{
  margin:0;
  background:#f7f6f3;
  color:#333;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang TC","Noto Sans TC",Arial,sans-serif;
}
header{
  background:#fff;
  padding:28px 20px 22px;
  text-align:center;
  border-bottom:1px solid #eee;
}
header h1{
  margin:0;
  font-size:20px;
  letter-spacing:2px;
  font-weight:600;
}
header .sub{
  margin-top:7px;
  font-size:15px;
  letter-spacing:2px;
}
header .small{
  margin-top:8px;
  font-size:12px;
  color:#999;
}
.top-area{
  padding:15px;
  max-width:900px;
  margin:auto;
}
.search-box{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.search-box input{
  flex:1;
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px 14px;
  font-size:14px;
  outline:none;
  background:#fff;
}
.add-btn{
  border:0;
  background:#333;
  color:#fff;
  border-radius:10px;
  padding:0 16px;
  font-size:14px;
}
.categories{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:5px;
}
.categories button{
  flex:none;
  border:1px solid #ddd;
  background:#fff;
  color:#666;
  border-radius:20px;
  padding:8px 13px;
  font-size:13px;
}
.categories button.active{
  background:#333;
  color:#fff;
  border-color:#333;
}
#cafeList{
  max-width:900px;
  margin:0 auto;
  padding:0 15px 40px;
}
.cafe-card{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
}
/* =========================
   照片
========================= */
.photo-area{
  background:#eee;
  position:relative;
  overflow:hidden;
}
.photo-wrap{
  width:min(var(--photo-size,260px),100%);
  aspect-ratio:1 / 1;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  background:#eee;
  touch-action:none;
}
.photo-wrap img{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  max-width:none;
  object-fit:cover;
  transform:
    translate(
      var(--photo-x,0px),
      var(--photo-y,0px)
    )
    scale(var(--photo-scale,1));
  transform-origin:center center;
  user-select:none;
  -webkit-user-drag:none;
}
.photo-placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:13px;
}
.photo-count{
  position:absolute;
  right:10px;
  bottom:10px;
  background:rgba(0,0,0,.55);
  color:#fff;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
}
/* =========================
   卡片
========================= */
.card-content{
  padding:16px;
}
.card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.card-title{
  font-size:18px;
  font-weight:600;
  margin:0;
}
.favorite{
  border:0;
  background:none;
  font-size:23px;
  padding:0;
  line-height:1;
}
.meta{
  margin-top:8px;
  color:#888;
  font-size:13px;
  line-height:1.7;
}
.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px;
}
.tag{
  background:#f2f1ee;
  color:#666;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
}
.description-box{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #eee;
}
.description-title{
  font-size:12px;
  color:#999;
  margin-bottom:5px;
}
.description{
  font-size:14px;
  color:#555;
  line-height:1.75;
  white-space:pre-wrap;
  word-break:break-word;
}
.card-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}
.card-actions button{
  flex:1;
  border:1px solid #ddd;
  background:#fff;
  border-radius:9px;
  padding:9px 5px;
  font-size:12px;
  color:#555;
}
.card-actions button.map{
  background:#333;
  color:#fff;
  border-color:#333;
}
.empty{
  text-align:center;
  color:#aaa;
  padding:60px 20px;
  font-size:14px;
}
/* =========================
   Modal
========================= */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:999;
}
.modal.show{
  display:flex;
}
.modal-box{
  background:#fff;
  width:100%;
  max-width:620px;
  max-height:90vh;
  overflow-y:auto;
  border-radius:16px;
  padding:20px;
}
.modal-title{
  font-size:18px;
  font-weight:600;
  margin-bottom:18px;
}
.form-group{
  margin-bottom:14px;
}
.form-group label{
  display:block;
  font-size:13px;
  color:#555;
  margin-bottom:7px;
}
.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid #ddd;
  border-radius:9px;
  padding:11px 12px;
  font-size:14px;
  outline:none;
  background:#fff;
}
.form-group textarea{
  min-height:110px;
  resize:vertical;
  line-height:1.7;
}
/* =========================
   照片大小
========================= */
.image-size-box{
  background:#f7f6f3;
  padding:12px;
  border-radius:10px;
}
.helper{
  font-size:11px;
  color:#999;
  margin-top:6px;
  line-height:1.6;
}
/* =========================
   每張照片調整
========================= */
.photo-edit-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.photo-editor{
  border:1px solid #eee;
  border-radius:12px;
  padding:12px;
  background:#fafafa;
}
.photo-editor-title{
  font-size:12px;
  color:#777;
  margin-bottom:10px;
}
.adjust-preview{
  width:180px;
  height:180px;
  margin:0 auto 12px;
  position:relative;
  overflow:hidden;
  background:#eee;
  border-radius:8px;
  touch-action:none;
  cursor:grab;
}
.adjust-preview:active{
  cursor:grabbing;
}
.adjust-preview img{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  max-width:none;
  object-fit:cover;
  transform:
    translate(
      var(--preview-x,0px),
      var(--preview-y,0px)
    )
    scale(var(--preview-scale,1));
  transform-origin:center center;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}
.adjust-controls{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}
.control-item{
  background:#fff;
  border-radius:9px;
  padding:9px;
}
.control-item label{
  font-size:11px;
  color:#777;
  display:block;
  margin-bottom:5px;
}
.control-item input[type="range"]{
  width:100%;
}
.range-value{
  text-align:center;
  font-size:11px;
  color:#999;
  margin-top:3px;
}
.drag-helper{
  text-align:center;
  font-size:11px;
  color:#999;
  margin-bottom:10px;
}
.preview-list{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}
.preview-item{
  position:relative;
  width:90px;
  height:90px;
  border-radius:8px;
  overflow:hidden;
  background:#eee;
}
.preview-item img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.preview-item button{
  position:absolute;
  right:4px;
  top:4px;
  width:22px;
  height:22px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  color:#fff;
  font-size:12px;
}
.modal-actions{
  display:flex;
  gap:8px;
  margin-top:20px;
}
.modal-actions button{
  flex:1;
  border:1px solid #ddd;
  background:#fff;
  padding:11px;
  border-radius:9px;
  font-size:14px;
}
.modal-actions .save{
  background:#333;
  color:#fff;
  border-color:#333;
}
.delete-btn{
  color:#b44 !important;
}
@media(max-width:600px){
  .adjust-preview{
    width:160px;
    height:160px;
  }
}
</style>
</head>
<body>
<header>
  <h1>MY CAFE GUIDE</h1>
  <div class="sub">台中咖啡廳</div>
  <div class="small">慢慢喝一杯，找到喜歡的地方 ♡</div>
</header>
<div class="top-area">
  <div class="search-box">
    <input
      id="searchInput"
      type="text"
      placeholder="搜尋咖啡廳、地址、特色..."
    >
    <button
      class="add-btn"
      onclick="openModal()"
    >
      ＋ 新增
    </button>
  </div>
  <div
    class="categories"
    id="categories"
  ></div>
</div>
<div id="cafeList"></div>
<div class="modal" id="modal">
  <div class="modal-box">
    <div
      class="modal-title"
      id="modalTitle"
    >
      新增咖啡廳
    </div>
    <div class="form-group">
      <label>店名</label>
      <input
        id="name"
        type="text"
        placeholder="例如：某某咖啡"
      >
    </div>
    <div class="form-group">
      <label>區域</label>
      <select id="area"></select>
    </div>
    <div class="form-group">
      <label>地址</label>
      <input
        id="address"
        type="text"
        placeholder="輸入地址"
      >
    </div>
    <div class="form-group">
      <label>Instagram</label>
      <input
        id="instagram"
        type="text"
        placeholder="Instagram 網址"
      >
    </div>
    <div class="form-group">
      <label>特色／標籤</label>
      <input
        id="tags"
        type="text"
        placeholder="例如：不限時, 有插座, 寵物友善"
      >
    </div>
    <div class="form-group">
      <label>照片</label>
      <input
        id="photos"
        type="file"
        accept="image/*,.heic,.heif"
        multiple
      >
      <div class="helper">
        可以一次選很多張照片，系統會自動壓縮。
      </div>
      <div
        class="preview-list"
        id="previewList"
      ></div>
    </div>
    <div class="form-group">
      <label>照片大小（1:1）</label>
      <div class="image-size-box">
        <input
          id="imageHeight"
          type="number"
          min="100"
          max="600"
          value="260"
        >
        <div class="helper">
          例如輸入 300，就是 300 × 300。<br>
          外框固定 1:1，照片可以自由縮放及移動。
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>調整照片</label>
      <div
        class="helper"
        style="margin-bottom:10px;"
      >
        可以直接用手指拖曳照片。<br>
        手機也可以雙指縮放。系統會自動防止照片露白。
      </div>
      <div
        class="photo-edit-list"
        id="photoEditList"
      ></div>
    </div>
    <div class="form-group">
      <label>備注</label>
      <textarea
        id="description"
        placeholder="輸入咖啡廳備注..."
      ></textarea>
    </div>
    <div class="modal-actions">
      <button
        onclick="closeModal()"
      >
        取消
      </button>
      <button
        class="delete-btn"
        id="deleteBtn"
        onclick="deleteCafe()"
        style="display:none;"
      >
        刪除
      </button>
      <button
        class="save"
        onclick="saveCafe()"
      >
        儲存
      </button>
    </div>
  </div>
</div>
<script>
const STORAGE_KEY = "myCafeGuide";
const areas = [
  "全部",
  "中區",
  "東區",
  "西區",
  "南區",
  "北區",
  "西屯區",
  "南屯區",
  "北屯區",
  "豐原區",
  "大里區",
  "太平區",
  "清水區",
  "沙鹿區",
  "大甲區",
  "后里區",
  "潭子區",
  "龍井區",
  "新社區"
];
let cafes = [];
try{
  cafes =
    JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "[]"
    );
  if(!Array.isArray(cafes)){
    cafes = [];
  }
}catch(error){
  console.error(error);
  cafes = [];
}
let currentArea = "全部";
let editingId = null;
let currentPhotos = [];
let db = null;
/* =========================================================
   IndexedDB
========================================================= */
function initDB(){
  return new Promise((resolve,reject)=>{
    const request =
      indexedDB.open(
        "MyCafeGuideImages",
        1
      );
    request.onupgradeneeded =
      function(event){
        const database =
          event.target.result;
        if(
          !database.objectStoreNames
            .contains("photos")
        ){
          database.createObjectStore(
            "photos",
            {
              keyPath:"id"
            }
          );
        }
      };
    request.onsuccess =
      function(event){
        db =
          event.target.result;
        resolve(db);
      };
    request.onerror =
      function(){
        reject(request.error);
      };
  });
}
function saveImageBlob(id,blob){
  return new Promise(
    (resolve,reject)=>{
      if(!db){
        resolve();
        return;
      }
      const tx =
        db.transaction(
          "photos",
          "readwrite"
        );
      tx.objectStore("photos")
        .put({
          id:id,
          blob:blob
        });
      tx.oncomplete =
        ()=>resolve();
      tx.onerror =
        ()=>reject(tx.error);
    }
  );
}
function getImageBlob(id){
  return new Promise(
    (resolve,reject)=>{
      if(!db){
        resolve(null);
        return;
      }
      const tx =
        db.transaction(
          "photos",
          "readonly"
        );
      const request =
        tx.objectStore("photos")
          .get(id);
      request.onsuccess =
        ()=>{
          resolve(
            request.result
              ? request.result.blob
              : null
          );
        };
      request.onerror =
        ()=>{
          reject(request.error);
        };
    }
  );
}
function deleteImageBlob(id){
  return new Promise(
    (resolve,reject)=>{
      if(!db){
        resolve();
        return;
      }
      const tx =
        db.transaction(
          "photos",
          "readwrite"
        );
      tx.objectStore("photos")
        .delete(id);
      tx.oncomplete =
        ()=>resolve();
      tx.onerror =
        ()=>reject(tx.error);
    }
  );
}
/* =========================================================
   HEIC
========================================================= */
function isHEIC(file){
  const name =
    file.name.toLowerCase();
  return(
    file.type === "image/heic" ||
    file.type === "image/heif" ||
    name.endsWith(".heic") ||
    name.endsWith(".heif")
  );
}
async function convertHEIC(file){
  if(!isHEIC(file)){
    return file;
  }
  if(
    typeof heic2any ===
    "undefined"
  ){
    throw new Error(
      "HEIC轉檔套件尚未載入"
    );
  }
  const converted =
    await heic2any({
      blob:file,
      toType:"image/jpeg",
      quality:.85
    });
  return Array.isArray(converted)
    ? converted[0]
    : converted;
}
/* =========================================================
   自動壓縮
========================================================= */
async function compressImage(file){
  const converted =
    await convertHEIC(file);
  return new Promise(
    (resolve,reject)=>{
      const img =
        new Image();
      const url =
        URL.createObjectURL(
          converted
        );
      img.onload =
        function(){
          URL.revokeObjectURL(
            url
          );
          let width =
            img.width;
          let height =
            img.height;
          const maxSize =
            1400;
          if(
            width > maxSize ||
            height > maxSize
          ){
            if(width > height){
              height =
                Math.round(
                  height *
                  maxSize /
                  width
                );
              width =
                maxSize;
            }else{
              width =
                Math.round(
                  width *
                  maxSize /
                  height
                );
              height =
                maxSize;
            }
          }
          const canvas =
            document.createElement(
              "canvas"
            );
          canvas.width =
            width;
          canvas.height =
            height;
          const ctx =
            canvas.getContext(
              "2d"
            );
          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );
          let quality =
            .82;
          function tryCompress(){
            canvas.toBlob(
              function(blob){
                if(!blob){
                  reject(
                    new Error(
                      "照片壓縮失敗"
                    )
                  );
                  return;
                }
                if(
                  blob.size >
                  180 * 1024 &&
                  quality > .45
                ){
                  quality -= .08;
                  tryCompress();
                }else{
                  resolve(blob);
                }
              },
              "image/jpeg",
              quality
            );
          }
          tryCompress();
        };
      img.onerror =
        function(){
          URL.revokeObjectURL(
            url
          );
          reject(
            new Error(
              "無法讀取圖片"
            )
          );
        };
      img.src = url;
    }
  );
}
/* =========================================================
   照片資料標準化
========================================================= */
function normalizePhoto(photo){
  return {
    id:
      photo?.id || null,
    blob:
      photo?.blob || null,
    data:
      photo?.data || null,
    url:
      photo?.url || null,
    scale:
      Number(photo?.scale) || 1,
    x:
      Number(photo?.x) || 0,
    y:
      Number(photo?.y) || 0
  };
}
/* =========================================================
   取得圖片來源
========================================================= */
function getPhotoSource(photo){
  if(photo.blob){
    return URL.createObjectURL(
      photo.blob
    );
  }
  if(photo.data){
    return photo.data;
  }
  if(photo.url){
    return photo.url;
  }
  return null;
}
/* =========================================================
   新增照片
========================================================= */
document
  .getElementById("photos")
  .addEventListener(
    "change",
    async function(event){
      const files =
        Array.from(
          event.target.files
        );
      if(!files.length){
        return;
      }
      for(
        const file of files
      ){
        try{
          const blob =
            await compressImage(
              file
            );
          currentPhotos.push({
            id:null,
            blob:blob,
            scale:1,
            x:0,
            y:0
          });
        }catch(error){
          console.error(error);
          alert(
            "有照片無法讀取，請確認照片格式。"
          );
        }
      }
      event.target.value = "";
      showPreview();
      renderPhotoEditors();
    }
  );
/* =========================================================
   縮圖
========================================================= */
function showPreview(){
  const list =
    document.getElementById(
      "previewList"
    );
  list.innerHTML = "";
  currentPhotos.forEach(
    (photo,index)=>{
      const item =
        document.createElement(
          "div"
        );
      item.className =
        "preview-item";
      const img =
        document.createElement(
          "img"
        );
      const src =
        getPhotoSource(photo);
      if(src){
        img.src = src;
      }
      item.appendChild(img);
      const button =
        document.createElement(
          "button"
        );
      button.innerHTML = "×";
      button.onclick =
        function(){
          removePhoto(index);
        };
      item.appendChild(
        button
      );
      list.appendChild(
        item
      );
    }
  );
}
/* =========================================================
   移除照片
========================================================= */
function removePhoto(index){
  currentPhotos.splice(
    index,
    1
  );
  showPreview();
  renderPhotoEditors();
}
/* =========================================================
   ★ 照片位置限制
   保證不會露白
========================================================= */
function clampPhotoPosition(
  photo,
  frameSize
){
  const scale =
    Math.max(
      1,
      Number(photo.scale) || 1
    );
  /*
    因為 img 本身使用 object-fit:cover，
    scale = 1 時已經可以完整覆蓋正方形。
    scale 越大，可移動範圍越大。
  */
  const maxMove =
    Math.max(
      0,
      (scale - 1) *
      frameSize /
      2
    );
  photo.x =
    Math.max(
      -maxMove,
      Math.min(
        maxMove,
        Number(photo.x) || 0
      )
    );
  photo.y =
    Math.max(
      -maxMove,
      Math.min(
        maxMove,
        Number(photo.y) || 0
      )
    );
}
/* =========================================================
   套用照片預覽
========================================================= */
function updatePhotoPreview(
  preview,
  img,
  photo
){
  const size =
    preview.clientWidth || 180;
  clampPhotoPosition(
    photo,
    size
  );
  preview.style.setProperty(
    "--preview-scale",
    Math.max(
      1,
      Number(photo.scale) || 1
    )
  );
  preview.style.setProperty(
    "--preview-x",
    `${photo.x || 0}px`
  );
  preview.style.setProperty(
    "--preview-y",
    `${photo.y || 0}px`
  );
}
/* =========================================================
   ★ 拖曳 + 雙指縮放
========================================================= */
function enablePhotoTouch(
  preview,
  img,
  photo
){
  const pointers =
    new Map();
  let startX = 0;
  let startY = 0;
  let startPhotoX = 0;
  let startPhotoY = 0;
  let startDistance = 0;
  let startScale = 1;
  function distance(a,b){
    return Math.hypot(
      a.clientX - b.clientX,
      a.clientY - b.clientY
    );
  }
  preview.addEventListener(
    "pointerdown",
    function(event){
      event.preventDefault();
      preview.setPointerCapture(
        event.pointerId
      );
      pointers.set(
        event.pointerId,
        event
      );
      if(pointers.size === 1){
        startX =
          event.clientX;
        startY =
          event.clientY;
        startPhotoX =
          Number(photo.x) || 0;
        startPhotoY =
          Number(photo.y) || 0;
      }
      if(pointers.size === 2){
        const pts =
          Array.from(
            pointers.values()
          );
        startDistance =
          distance(
            pts[0],
            pts[1]
          );
        startScale =
          Math.max(
            1,
            Number(photo.scale) || 1
          );
      }
    },
    {passive:false}
  );
  preview.addEventListener(
    "pointermove",
    function(event){
      if(
        !pointers.has(
          event.pointerId
        )
      ){
        return;
      }
      event.preventDefault();
      pointers.set(
        event.pointerId,
        event
      );
      /* =====================
         單指拖曳
      ===================== */
      if(pointers.size === 1){
        const dx =
          event.clientX -
          startX;
        const dy =
          event.clientY -
          startY;
        photo.x =
          startPhotoX + dx;
        photo.y =
          startPhotoY + dy;
        updatePhotoPreview(
          preview,
          img,
          photo
        );
        return;
      }
      /* =====================
         雙指縮放
      ===================== */
      if(pointers.size >= 2){
        const pts =
          Array.from(
            pointers.values()
          );
        const newDistance =
          distance(
            pts[0],
            pts[1]
          );
        if(startDistance > 0){
          const ratio =
            newDistance /
            startDistance;
          photo.scale =
            Math.max(
              1,
              Math.min(
                3,
                startScale *
                ratio
              )
            );
          updatePhotoPreview(
            preview,
            img,
            photo
          );
        }
      }
    },
    {passive:false}
  );
  preview.addEventListener(
    "pointerup",
    function(event){
      pointers.delete(
        event.pointerId
      );
    }
  );
  preview.addEventListener(
    "pointercancel",
    function(event){
      pointers.delete(
        event.pointerId
      );
    }
  );
  preview.addEventListener(
    "wheel",
    function(event){
      event.preventDefault();
      const current =
        Math.max(
          1,
          Number(photo.scale) || 1
        );
      photo.scale =
        Math.max(
          1,
          Math.min(
            3,
            current +
            (event.deltaY < 0
              ? .05
              : -.05)
          )
        );
      updatePhotoPreview(
        preview,
        img,
        photo
      );
      const range =
        preview
          .parentElement
          ?.querySelector(
            'input[type="range"]'
          );
      if(range){
        range.value =
          photo.scale;
      }
      const value =
        preview
          .parentElement
          ?.querySelector(
            ".range-value"
          );
      if(value){
        value.textContent =
          Math.round(
            photo.scale * 100
          ) + "%";
      }
    },
    {passive:false}
  );
}

      scaleControl.appendChild(

/* =========================================================
   儲存照片
========================================================= */
async function saveCurrentPhotos(
  cafeId
){
  const refs = [];
  for(
    let i=0;
    i<currentPhotos.length;
    i++
  ){
    const photo =
      currentPhotos[i];
    if(
      photo.id &&
      photo.blob
    ){
      await saveImageBlob(
        photo.id,
        photo.blob
      );
      refs.push({
        id:photo.id,
        scale:
          Math.max(
            1,
            photo.scale || 1
          ),
        x:
          photo.x || 0,
        y:
          photo.y || 0
      });
      continue;
    }
    if(photo.blob){
      const imageId =
        cafeId +
        "_" +
        Date.now() +
        "_" +
        i +
        "_" +
        Math.random()
          .toString(36)
          .slice(2,8);
      await saveImageBlob(
        imageId,
        photo.blob
      );
      refs.push({
        id:imageId,
        scale:
          Math.max(
            1,
            photo.scale || 1
          ),
        x:
          photo.x || 0,
        y:
          photo.y || 0
      });
      continue;
    }
    if(photo.data){
      try{
        const response =
          await fetch(
            photo.data
          );
        const blob =
          await response.blob();
        const imageId =
          cafeId +
          "_" +
          Date.now() +
          "_" +
          i +
          "_" +
          Math.random()
            .toString(36)
            .slice(2,8);
        await saveImageBlob(
          imageId,
          blob
        );
        refs.push({
          id:imageId,
          scale:
            Math.max(
              1,
              photo.scale || 1
            ),
          x:
            photo.x || 0,
          y:
            photo.y || 0
        });
      }catch(error){
        console.error(
          error
        );
      }
    }
  }
  return refs;
}

    cafes.unshift({
      id:cafeId,
      name:name,
      area:area,
      address:address,
      instagram:instagram,
      tags:tags,
      description:description,
      imageHeight:imageHeight,
      photos:photoRefs,
      favorite:false
    });
  }
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      cafes
    )
  );
  closeModal();
  renderCafes();
}
/* =========================================================
   刪除
========================================================= */
async function deleteCafe(){
  if(!editingId){
    return;
  }
  await deleteCafeById(
    editingId
  );
}
async function deleteCafeById(
  id
){
  const cafe =
    cafes.find(
      cafe=>cafe.id === id
    );
  if(!cafe){
    return;
  }
  const ok =
    confirm(
      `確定要刪除「${cafe.name}」嗎？`
    );
  if(!ok){
    return;
  }
  if(
    Array.isArray(
      cafe.photos
    )
  ){
    for(
      const photo of cafe.photos
    ){
      if(photo.id){
        try{
          await deleteImageBlob(
            photo.id
          );
        }catch(error){
          console.error(
            error
          );
        }
      }
    }
  }
  cafes =
    cafes.filter(
      cafe=>
        cafe.id !== id
    );
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      cafes
    )
  );
  closeModal();
  renderCafes();
}
/* =========================================================
   收藏
========================================================= */
function toggleFavorite(id){
  const cafe =
    cafes.find(
      cafe=>cafe.id === id
    );
  if(!cafe){
    return;
  }
  if(
    typeof cafe.favorite ===
    "boolean"
  ){
    cafe.favorite =
      !cafe.favorite;
  }else if(
    typeof cafe.fav ===
    "boolean"
  ){
    cafe.fav =
      !cafe.fav;
  }else{
    cafe.favorite =
      true;
  }
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      cafes
    )
  );
  renderCafes();
}
/* =========================================================
   Google Maps
========================================================= */
function openMap(
  address
){
  if(!address){
    alert(
      "這家店還沒有地址"
    );
    return;
  }
  const url =
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(
      address
    );
  window.open(
    url,
    "_blank"
  );
}
