<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY CAFE GUIDE｜台中咖啡廳</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f6f3;
  color:#333;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang TC","Noto Sans TC",Arial,sans-serif;
}

header{
  background:#fff;
  padding:28px 20px 22px;
  text-align:center;
  border-bottom:1px solid #eee;
}

header h1{
  margin:0;
  font-size:20px;
  letter-spacing:2px;
  font-weight:600;
}

header .sub{
  margin-top:7px;
  font-size:15px;
  letter-spacing:2px;
}

header .small{
  margin-top:8px;
  font-size:12px;
  color:#999;
}

.top-area{
  padding:15px;
  max-width:900px;
  margin:auto;
}

.search-box{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.search-box input{
  flex:1;
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px 14px;
  font-size:14px;
  outline:none;
  background:#fff;
}

.add-btn{
  border:0;
  background:#333;
  color:#fff;
  border-radius:10px;
  padding:0 16px;
  font-size:14px;
}

.categories{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:5px;
}

.categories button{
  flex:none;
  border:1px solid #ddd;
  background:#fff;
  color:#666;
  border-radius:20px;
  padding:8px 13px;
  font-size:13px;
}

.categories button.active{
  background:#333;
  color:#fff;
  border-color:#333;
}

#cafeList{
  max-width:900px;
  margin:0 auto;
  padding:0 15px 40px;
}

.cafe-card{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
}

/* =========================
   照片
========================= */

.photo-area{
  background:#eee;
  position:relative;
  overflow:hidden;
}

/* 固定 1:1，而且可以調整整個正方形大小 */
.photo-wrap{
  width:min(var(--photo-size,260px),100%);
  aspect-ratio:1 / 1;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  background:#eee;
}

.photo-wrap img{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  max-width:none;
  object-fit:cover;

  transform:
    translate(
      var(--photo-x,0%),
      var(--photo-y,0%)
    )
    scale(var(--photo-scale,1));

  transform-origin:center center;
}

.photo-placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:13px;
}

.photo-count{
  position:absolute;
  right:10px;
  bottom:10px;
  background:rgba(0,0,0,.55);
  color:#fff;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
}

/* =========================
   卡片
========================= */

.card-content{
  padding:16px;
}

.card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.card-title{
  font-size:18px;
  font-weight:600;
  margin:0;
}

.favorite{
  border:0;
  background:none;
  font-size:23px;
  padding:0;
  line-height:1;
}

.meta{
  margin-top:8px;
  color:#888;
  font-size:13px;
  line-height:1.7;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px;
}

.tag{
  background:#f2f1ee;
  color:#666;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
}

/* 備注保持正常排版，不飄 */
.description-box{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #eee;
}

.description-title{
  font-size:12px;
  color:#999;
  margin-bottom:5px;
}

.description{
  font-size:14px;
  color:#555;
  line-height:1.75;
  white-space:pre-wrap;
  word-break:break-word;
}

.card-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.card-actions button{
  flex:1;
  border:1px solid #ddd;
  background:#fff;
  border-radius:9px;
  padding:9px 5px;
  font-size:12px;
  color:#555;
}

.card-actions button.map{
  background:#333;
  color:#fff;
  border-color:#333;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:60px 20px;
  font-size:14px;
}

/* =========================
   Modal
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:999;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:#fff;
  width:100%;
  max-width:620px;
  max-height:90vh;
  overflow-y:auto;
  border-radius:16px;
  padding:20px;
}

.modal-title{
  font-size:18px;
  font-weight:600;
  margin-bottom:18px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  font-size:13px;
  color:#555;
  margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid #ddd;
  border-radius:9px;
  padding:11px 12px;
  font-size:14px;
  outline:none;
  background:#fff;
}

.form-group textarea{
  min-height:110px;
  resize:vertical;
  line-height:1.7;
}

/* =========================
   照片大小
========================= */

.image-size-box{
  background:#f7f6f3;
  padding:12px;
  border-radius:10px;
}

.helper{
  font-size:11px;
  color:#999;
  margin-top:6px;
  line-height:1.6;
}

/* =========================
   每張照片調整
========================= */

.photo-edit-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.photo-editor{
  border:1px solid #eee;
  border-radius:12px;
  padding:12px;
  background:#fafafa;
}

.photo-editor-title{
  font-size:12px;
  color:#777;
  margin-bottom:10px;
}

.adjust-preview{
  width:180px;
  height:180px;
  margin:0 auto 12px;
  position:relative;
  overflow:hidden;
  background:#eee;
  border-radius:8px;
}

.adjust-preview img{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  max-width:none;
  object-fit:cover;

  transform:
    translate(
      var(--preview-x,0%),
      var(--preview-y,0%)
    )
    scale(var(--preview-scale,1));

  transform-origin:center center;
}

.adjust-controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.control-item{
  background:#fff;
  border-radius:9px;
  padding:9px;
}

.control-item.full{
  grid-column:1 / -1;
}

.control-item label{
  font-size:11px;
  color:#777;
  display:block;
  margin-bottom:5px;
}

.control-item input[type="range"]{
  width:100%;
}

.range-value{
  text-align:center;
  font-size:11px;
  color:#999;
  margin-top:3px;
}

.preview-list{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.preview-item{
  position:relative;
  width:90px;
  height:90px;
  border-radius:8px;
  overflow:hidden;
  background:#eee;
}

.preview-item img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.preview-item button{
  position:absolute;
  right:4px;
  top:4px;
  width:22px;
  height:22px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  color:#fff;
  font-size:12px;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.modal-actions button{
  flex:1;
  border:1px solid #ddd;
  background:#fff;
  padding:11px;
  border-radius:9px;
  font-size:14px;
}

.modal-actions .save{
  background:#333;
  color:#fff;
  border-color:#333;
}

.delete-btn{
  color:#b44 !important;
}

@media(max-width:600px){

  .adjust-preview{
    width:160px;
    height:160px;
  }

}
</style>
</head>

<body>

<header>
  <h1>MY CAFE GUIDE</h1>
  <div class="sub">台中咖啡廳</div>
  <div class="small">慢慢喝一杯，找到喜歡的地方 ♡</div>
</header>

<div class="top-area">

  <div class="search-box">
    <input
      id="searchInput"
      type="text"
      placeholder="搜尋咖啡廳、地址、特色..."
    >

    <button
      class="add-btn"
      onclick="openModal()"
    >
      ＋ 新增
    </button>
  </div>

  <div
    class="categories"
    id="categories"
  ></div>

</div>

<div id="cafeList"></div>

<!-- =========================
     編輯視窗
========================= -->

<div
  class="modal"
  id="modal"
>

  <div class="modal-box">

    <div
      class="modal-title"
      id="modalTitle"
    >
      新增咖啡廳
    </div>

    <div class="form-group">
      <label>店名</label>

      <input
        id="name"
        type="text"
        placeholder="例如：某某咖啡"
      >
    </div>

    <div class="form-group">
      <label>區域</label>

      <select id="area"></select>
    </div>

    <div class="form-group">
      <label>地址</label>

      <input
        id="address"
        type="text"
        placeholder="輸入地址"
      >
    </div>

    <div class="form-group">
      <label>Instagram</label>

      <input
        id="instagram"
        type="text"
        placeholder="Instagram 網址"
      >
    </div>

    <div class="form-group">
      <label>特色／標籤</label>

      <input
        id="tags"
        type="text"
        placeholder="例如：不限時, 有插座, 寵物友善"
      >
    </div>

    <div class="form-group">

      <label>照片</label>

      <input
        id="photos"
        type="file"
        accept="image/*,.heic,.heif"
        multiple
      >

      <div class="helper">
        可以一次選很多張照片，系統會自動壓縮。
      </div>

      <div
        class="preview-list"
        id="previewList"
      ></div>

    </div>

    <div class="form-group">

      <label>照片大小（1:1）</label>

      <div class="image-size-box">

        <input
          id="imageHeight"
          type="number"
          min="100"
          max="600"
          value="260"
        >

        <div class="helper">
          例如輸入 300，就是 300 × 300。<br>
          照片會固定為 1:1 正方形。
        </div>

      </div>

    </div>

    <div class="form-group">

      <label>調整照片位置</label>

      <div
        class="helper"
        style="margin-bottom:10px;"
      >
        每張照片可以個別調整。<br>
        食物在下面，就把「上下位置」往上調。
      </div>

      <div
        class="photo-edit-list"
        id="photoEditList"
      ></div>

    </div>

    <!-- 原本備注欄 -->
    <div class="form-group">

      <label>備注</label>

      <textarea
        id="description"
        placeholder="輸入咖啡廳備注..."
      ></textarea>

    </div>

    <div class="modal-actions">

      <button
        onclick="closeModal()"
      >
        取消
      </button>

      <button
        class="delete-btn"
        id="deleteBtn"
        onclick="deleteCafe()"
        style="display:none;"
      >
        刪除
      </button>

      <button
        class="save"
        onclick="saveCafe()"
      >
        儲存
      </button>

    </div>

  </div>

</div>

<script>

/* =========================================================
   ★★★ 最重要：沿用原本資料 key，不改
========================================================= */

const STORAGE_KEY = "myCafeGuide";


/* =========================================================
   原本區域
========================================================= */

const areas = [
  "全部",
  "中區",
  "東區",
  "西區",
  "南區",
  "北區",
  "西屯區",
  "南屯區",
  "北屯區",
  "豐原區",
  "大里區",
  "太平區",
  "清水區",
  "沙鹿區",
  "大甲區",
  "后里區",
  "潭子區",
  "龍井區",
  "新社區"
];


/* =========================================================
   ★ 讀取原本資料
   不建立新的資料庫、不清空
========================================================= */

let cafes = [];

try{

  cafes =
    JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "[]"
    );

  if(!Array.isArray(cafes)){
    cafes = [];
  }

}catch(error){

  console.error(error);
  cafes = [];

}


/* =========================================================
   狀態
========================================================= */

let currentArea = "全部";

let editingId = null;

let currentPhotos = [];

let db = null;


/* =========================================================
   IndexedDB
   只拿來存照片，不動原本咖啡廳資料
========================================================= */

function initDB(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open(
        "MyCafeGuideImages",
        1
      );

    request.onupgradeneeded =
      function(event){

        const database =
          event.target.result;

        if(
          !database.objectStoreNames
            .contains("photos")
        ){

          database.createObjectStore(
            "photos",
            {
              keyPath:"id"
            }
          );

        }

      };

    request.onsuccess =
      function(event){

        db =
          event.target.result;

        resolve(db);

      };

    request.onerror =
      function(){

        reject(request.error);

      };

  });

}


/* =========================================================
   存照片
========================================================= */

function saveImageBlob(id,blob){

  return new Promise(
    (resolve,reject)=>{

      if(!db){
        resolve();
        return;
      }

      const tx =
        db.transaction(
          "photos",
          "readwrite"
        );

      tx.objectStore("photos")
        .put({
          id:id,
          blob:blob
        });

      tx.oncomplete =
        ()=>resolve();

      tx.onerror =
        ()=>reject(tx.error);

    }
  );

}


/* =========================================================
   讀照片
========================================================= */

function getImageBlob(id){

  return new Promise(
    (resolve,reject)=>{

      if(!db){
        resolve(null);
        return;
      }

      const tx =
        db.transaction(
          "photos",
          "readonly"
        );

      const request =
        tx.objectStore("photos")
          .get(id);

      request.onsuccess =
        ()=>{
          resolve(
            request.result
              ? request.result.blob
              : null
          );
        };

      request.onerror =
        ()=>{
          reject(request.error);
        };

    }
  );

}


/* =========================================================
   刪照片
========================================================= */

function deleteImageBlob(id){

  return new Promise(
    (resolve,reject)=>{

      if(!db){
        resolve();
        return;
      }

      const tx =
        db.transaction(
          "photos",
          "readwrite"
        );

      tx.objectStore("photos")
        .delete(id);

      tx.oncomplete =
        ()=>resolve();

      tx.onerror =
        ()=>reject(tx.error);

    }
  );

}


/* =========================================================
   HEIC
========================================================= */

function isHEIC(file){

  const name =
    file.name.toLowerCase();

  return(
    file.type === "image/heic" ||
    file.type === "image/heif" ||
    name.endsWith(".heic") ||
    name.endsWith(".heif")
  );

}


async function convertHEIC(file){

  if(!isHEIC(file)){
    return file;
  }

  if(
    typeof heic2any ===
    "undefined"
  ){

    throw new Error(
      "HEIC轉檔套件尚未載入"
    );

  }

  const converted =
    await heic2any({
      blob:file,
      toType:"image/jpeg",
      quality:.85
    });

  return Array.isArray(converted)
    ? converted[0]
    : converted;

}


/* =========================================================
   自動壓縮
========================================================= */

async function compressImage(file){

  const converted =
    await convertHEIC(file);

  return new Promise(
    (resolve,reject)=>{

      const img =
        new Image();

      const url =
        URL.createObjectURL(
          converted
        );

      img.onload =
        function(){

          URL.revokeObjectURL(
            url
          );

          let width =
            img.width;

          let height =
            img.height;

          const maxSize =
            1400;

          if(
            width > maxSize ||
            height > maxSize
          ){

            if(width > height){

              height =
                Math.round(
                  height *
                  maxSize /
                  width
                );

              width =
                maxSize;

            }else{

              width =
                Math.round(
                  width *
                  maxSize /
                  height
                );

              height =
                maxSize;

            }

          }

          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width =
            width;

          canvas.height =
            height;

          const ctx =
            canvas.getContext(
              "2d"
            );

          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );

          let quality =
            .82;

          function tryCompress(){

            canvas.toBlob(
              function(blob){

                if(!blob){

                  reject(
                    new Error(
                      "照片壓縮失敗"
                    )
                  );

                  return;

                }

                if(
                  blob.size >
                  180 * 1024 &&
                  quality > .45
                ){

                  quality -= .08;

                  tryCompress();

                }else{

                  resolve(blob);

                }

              },
              "image/jpeg",
              quality
            );

          }

          tryCompress();

        };

      img.onerror =
        function(){

          URL.revokeObjectURL(
            url
          );

          reject(
            new Error(
              "無法讀取圖片"
            )
          );

        };

      img.src = url;

    }
  );

}


/* =========================================================
   新增照片
========================================================= */

document
  .getElementById("photos")
  .addEventListener(
    "change",
    async function(event){

      const files =
        Array.from(
          event.target.files
        );

      if(!files.length){
        return;
      }

      for(
        const file of files
      ){

        try{

          const blob =
            await compressImage(
              file
            );

          currentPhotos.push({

            id:null,

            blob:blob,

            /* ★ 新照片預設不改變原本顯示 */

            scale:1,

            x:0,

            y:0

          });

        }catch(error){

          console.error(error);

          alert(
            "有照片無法讀取，請確認照片格式。"
          );

        }

      }

      event.target.value = "";

      showPreview();

      renderPhotoEditors();

    }
  );


/* =========================================================
   照片縮圖
========================================================= */

function showPreview(){

  const list =
    document.getElementById(
      "previewList"
    );

  list.innerHTML = "";

  currentPhotos.forEach(
    (photo,index)=>{

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "preview-item";

      const img =
        document.createElement(
          "img"
        );

      if(photo.blob){

        img.src =
          URL.createObjectURL(
            photo.blob
          );

      }else if(photo.url){

        img.src =
          photo.url;

      }else if(photo.data){

        img.src =
          photo.data;

      }

      item.appendChild(img);

      const button =
        document.createElement(
          "button"
        );

      button.innerHTML = "×";

      button.onclick =
        function(){

          removePhoto(index);

        };

      item.appendChild(
        button
      );

      list.appendChild(
        item
      );

    }
  );

}


/* =========================================================
   移除照片
========================================================= */

function removePhoto(index){

  currentPhotos.splice(
    index,
    1
  );

  showPreview();

  renderPhotoEditors();

}


/* =========================================================
   ★ 每張照片的調整器
========================================================= */

function renderPhotoEditors(){

  const list =
    document.getElementById(
      "photoEditList"
    );

  list.innerHTML = "";

  currentPhotos.forEach(
    (photo,index)=>{

      const box =
        document.createElement(
          "div"
        );

      box.className =
        "photo-editor";


      const title =
        document.createElement(
          "div"
        );

      title.className =
        "photo-editor-title";

      title.textContent =
        `第 ${index + 1} 張照片`;

      box.appendChild(title);


      /* 預覽 */

      const preview =
        document.createElement(
          "div"
        );

      preview.className =
        "adjust-preview";


      const img =
        document.createElement(
          "img"
        );


      if(photo.blob){

        img.src =
          URL.createObjectURL(
            photo.blob
          );

      }else if(photo.url){

        img.src =
          photo.url;

      }else if(photo.data){

        img.src =
          photo.data;

      }


      preview.appendChild(img);

      box.appendChild(
        preview
      );


      const controls =
        document.createElement(
          "div"
        );

      controls.className =
        "adjust-controls";


      /* =====================
         縮放
      ===================== */

      const scaleControl =
        document.createElement(
          "div"

function updatePhotoPreview(
  preview,
  img,
  photo
){

  preview.style.setProperty(
    "--preview-scale",
    photo.scale || 1
  );

  preview.style.setProperty(
    "--preview-x",
    `${photo.x || 0}%`
  );

  preview.style.setProperty(
    "--preview-y",
    `${photo.y || 0}%`
  );

}

async function renderCafes(){

  const list =
    document.getElementById(
      "cafeList"
    );

  const keyword =
    document.getElementById(
      "searchInput"
    )
    .value
    .trim()
    .toLowerCase();


  const filtered =
    cafes.filter(
      cafe=>{

        const areaOK =
          currentArea === "全部" ||
          cafe.area === currentArea;


        const text = [

          cafe.name,

          cafe.area,

          cafe.address,

          cafe.tags,

          cafe.description,

          cafe.note

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


        const searchOK =
          !keyword ||
          text.includes(
            keyword
          );


        return (
          areaOK &&
          searchOK
        );

      }
    );


  if(!filtered.length){

    list.innerHTML =
      `
      <div class="empty">
        目前沒有符合的咖啡廳 ♡

    const photoWrap =
      document.createElement(
        "div"

    photoWrap.className =

    photoWrap.style.setProperty(
      "--photo-size",
      `${photoSize}px`
    );


    const photo =

      cafe.photos.length
        ? cafe.photos[0]
        : null;


    if(photo){

      const img =
        document.createElement(
          "img"

      /* 舊格式 */

      if(photo.data){

      }else if(photo.url){

        if(

              null,

            scale:
              Number(
                photo.scale
              ) || 1,

            x:
              Number(
                photo.x
              ) || 0,

            y:
              Number(

              ) || 0

/* =========================================================
   儲存照片
========================================================= */

async function saveCurrentPhotos(
  cafeId
){

  const refs = [];


  for(
    let i=0;
    i<currentPhotos.length;
    i++
  ){

    const photo =
      currentPhotos[i];


    /* 已經存在 IndexedDB */

    if(
      photo.id &&
      photo.blob
    ){

      await saveImageBlob(
        photo.id,
        photo.blob
      );


      refs.push({

        id:photo.id,

        scale:
          photo.scale || 1,

        x:
          photo.x || 0,

        y:
          photo.y || 0

      });


      continue;

    }


    /* 新照片 */

    if(photo.blob){

      const imageId =
        cafeId +
        "_" +
        Date.now() +
        "_" +
        i +
        "_" +
        Math.random()
          .toString(36)
          .slice(2,8);


      await saveImageBlob(
        imageId,
        photo.blob
      );


      refs.push({

        id:imageId,

        scale:
          photo.scale || 1,

        x:
          photo.x || 0,

        y:
          photo.y || 0

      });


      continue;

    }


    /* 舊 Base64 */

    if(photo.data){

      try{

        const response =
          await fetch(
            photo.data
          );

        const blob =
          await response.blob();


        const imageId =
          cafeId +
          "_" +
          Date.now() +
          "_" +
          i +
          "_" +
          Math.random()
            .toString(36)
            .slice(2,8);


        await saveImageBlob(
          imageId,
          blob
        );


        refs.push({

          id:imageId,

          scale:
            photo.scale || 1,

          x:
            photo.x || 0,

          y:
            photo.y || 0

        });

      }catch(error){

        console.error(
          error
        );

      }

    }

  }


  return refs;

}

async function saveCafe(){

  const name =
    document
      .getElementById("name")

  if(!name){

    );

    return;

  }


  const area =

      .value;


  const address =
    document
      .getElementById("address")
      .value
      .trim();


  const instagram =
    document
      .getElementById("instagram")
      .value
      .trim();


  const tags =
    document
      .getElementById("tags")
      .value
      .trim();


  const description =
    document
      .getElementById("description")
      .value;


  const imageHeight =
    Math.max(
      100,
      Math.min(
        600,
        Number(
          document
            .getElementById(
              "imageHeight"
            )
            .value
        ) || 260
      )
    );


  /* 編輯原本店家 */

  if(editingId){

    const cafe =
      cafes.find(
        cafe=>
          cafe.id ===
          editingId
      );


    if(!cafe){

      alert(
        "找不到這間咖啡廳"
      );

      return;

    }


    /*
      ★ 直接修改原本物件
      不重新建立資料
      不會把原本欄位弄掉
    */

    cafe.name =
      name;

    cafe.area =
      area;

    cafe.address =
      address;

    cafe.instagram =
      instagram;

    cafe.tags =
      tags;

    cafe.description =
      description;

    cafe.imageHeight =
      imageHeight;


    /*
      ★ 收藏狀態完全保留
    */


    if(
      currentPhotos.length ||
      Array.isArray(
        cafe.photos
      )
    ){

      cafe.photos =
        await saveCurrentPhotos(
          cafe.id
        );

    }


  }else{

    /* 新增 */

    const cafeId =
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,8);


    const photoRefs =
      await saveCurrentPhotos(
        cafeId
      );


    cafes.unshift({

      id:cafeId,

      name:name,

      area:area,

      address:address,

      instagram:instagram,

      tags:tags,

      description:description,

      imageHeight:imageHeight,

      photos:photoRefs,

      favorite:false

    });

  }


  /*
    ★ 仍然使用原本 myCafeGuide
  */

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      cafes
    )
  );


  closeModal();

  renderCafes();

}

async function deleteCafeById(
  id
){

  const cafe =
    cafes.find(
      cafe=>cafe.id === id
    );


  if(!cafe){
    return;
  }


  const ok =
    confirm(
      `確定要刪除「${cafe.name}」嗎？`
    );


  if(!ok){
    return;
  }


  /*
    刪除 IndexedDB 照片
  */

  if(
    Array.isArray(
      cafe.photos
    )
  ){

    for(
      const photo of cafe.photos
    ){

      if(photo.id){

        try{

          await deleteImageBlob(
            photo.id
          );

        }catch(error){

          console.error(
            error
          );

        }

      }

    }

  }


  cafes =
    cafes.filter(
      cafe=>
        cafe.id !== id
    );


  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      cafes
    )
  );


  closeModal();

  renderCafes();

}


/* =========================================================
   收藏
========================================================= */

function toggleFavorite(id){

  const cafe =
    cafes.find(
      cafe=>cafe.id === id
    );


  if(!cafe){
    return;
  }


  /*
    支援舊版 favorite / fav
  */

  if(
    typeof cafe.favorite ===
    "boolean"
  ){

    cafe.favorite =
      !cafe.favorite;

  }else if(
    typeof cafe.fav ===
    "boolean"
  ){

    cafe.fav =
      !cafe.fav;

  }else{

    cafe.favorite =
      true;

  }


  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      cafes
    )
  );


  renderCafes();

}


/* =========================================================
   Google Maps
========================================================= */

function openMap(
  address
){

  if(!address){

    alert(
      "這家店還沒有地址"
    );

    return;

  }


  const url =
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(
      address
    );


  window.open(
    url,
    "_blank"
  );

}

   搜尋
========================================================= */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    function(){

      renderCafes();

    }
  );


/* =========================================================
   點背景關閉
========================================================= */

document
  .getElementById("modal")
  .addEventListener(
    "click",
    function(event){

      if(
        event.target ===
        this
      ){

        closeModal();

      }

    }
  );


/* =========================================================
   初始化
========================================================= */

(async function(){

  try{

    await initDB();

  }catch(error){

    console.error(
      "IndexedDB 初始化失敗",
      error
    );

  }


  renderCategories();

  renderCafes();

})();
